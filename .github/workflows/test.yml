name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-tests:
    name: shell tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n codex-auth-snap

      - name: Run shell test suite
        run: bash tests/test_codex_auth_snap.sh
